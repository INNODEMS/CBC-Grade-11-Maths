<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphical Methods — interactive figures preview</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.8.0/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.8.0/jsxgraph.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
    <style>
        body { font-family: Georgia, serif; max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; color:#222; }
        h1 { font-size: 1.4rem; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1.6rem; }
        figure { margin: 0; border: 1px solid #eee; border-radius: 8px; padding: .7rem; }
        figcaption { font-size: .92rem; color: #333; margin-bottom: .45rem; font-weight: bold; }
        .jxgbox { width: 100%; height: 460px; }
    </style>
</head>
<body>
    <h1>Graphical Methods — 8 interactive figures</h1>
    <div class="grid">
        <figure><figcaption>13.1 Graphing circles</figcaption><div id="jsx-graphing-circles" class="jxgbox"></div></figure>
        <figure><figcaption>13.2 Graphing quadratics</figcaption><div id="jsx-graphing-quadratics" class="jxgbox"></div></figure>
        <figure><figcaption>13.3 Quadratic roots + discriminant</figcaption><div id="jsx-quadratic-roots" class="jxgbox"></div></figure>
        <figure><figcaption>13.3 Cubic roots</figcaption><div id="jsx-cubic-roots" class="jxgbox"></div></figure>
        <figure><figcaption>13.4 Simultaneous equations</figcaption><div id="jsx-simultaneous-equations" class="jxgbox"></div></figure>
        <figure><figcaption>13.5 Average rate of change</figcaption><div id="jsx-average-rate-of-change" class="jxgbox"></div></figure>
        <figure><figcaption>13.6 Instantaneous rate of change</figcaption><div id="jsx-instantaneous-rate-of-change" class="jxgbox"></div></figure>
        <figure><figcaption>13.7 Graphing empirical data</figcaption><div id="jsx-graphing-empirical-data" class="jxgbox"></div>
            <div style="text-align:center;font:14px system-ui,Arial,sans-serif;">
                <div style="margin:2px;">Horizontal (independent):
                    <input type="button" value="Grade level" onclick="gedHoriz('grade');"/>
                    <input type="button" value="Number of students" onclick="gedHoriz('students');"/>
                </div>
                <div style="margin:2px;">Vertical (dependent):
                    <input type="button" value="Grade level" onclick="gedVert('grade');"/>
                    <input type="button" value="Number of students" onclick="gedVert('students');"/>
                </div>
                <div style="margin:6px 2px;">
                    <input type="button" value="Check Plot" onclick="gedCheck();" style="font-weight:bold;"/>
                    <input type="button" value="Reset" onclick="gedReset();"/>
                </div>
                <div id="ged_status" style="min-height:48px;color:#222;"></div>
            </div>
        </figure>
    </div>
    <script src="graphing-circles.js"></script>
    <script src="graphing-quadratics.js"></script>
    <script src="quadratic-roots.js"></script>
    <script src="cubic-roots.js"></script>
    <script src="simultaneous-equations.js"></script>
    <script src="average-rate-of-change.js"></script>
    <script src="instantaneous-rate-of-change.js"></script>
    <script src="graphing-empirical-data.js"></script>
</body>
</html>
